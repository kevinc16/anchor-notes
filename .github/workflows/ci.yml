name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and CSS formatting
        run: npm run format:check

      - name: Lint TypeScript and CSS
        run: npm run lint

      - name: Check lint autofix is clean
        run: |
          npm run lint:fix
          git diff --exit-code

  unit:
    name: Unit tests, coverage, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      coverage-artifact-url: ${{ steps.upload-coverage.outputs.artifact-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Add coverage summary to workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Unit test coverage"
            echo
            if [ -f coverage/coverage-summary.txt ]; then
              echo '```text'
              cat coverage/coverage-summary.txt
              echo '```'
            else
              echo "Coverage report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        id: upload-coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Check TypeScript
        run: npm run compile

  publish-coverage-report:
    name: Publish coverage report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: unit-test-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/

      - name: Update coverage PR comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.unit.outputs.coverage-artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ needs.unit.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- anchor-notes-coverage-report -->';
            const runUrl = process.env.RUN_URL;
            const artifactUrl = process.env.ARTIFACT_URL || runUrl;
            const status = process.env.JOB_STATUS === 'success' ? 'passed' : 'did not pass';
            const summaryPath = 'coverage/coverage-summary.txt';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : 'Coverage report was not generated.';
            const body = [
              marker,
              '## Unit test coverage',
              '',
              `Unit tests **${status}**. Coverage is advisory; no percentage threshold is enforced.`,
              '',
              '```text',
              summary,
              '```',
              '',
              `[Download the detailed coverage report](${artifactUrl})`,
              '',
              `[View the CI run](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      playwright-artifact-url: ${{ steps.upload-playwright-artifacts.outputs.artifact-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright report and screenshots
        id: upload-playwright-artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-playwright-report:
    name: Publish Playwright report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Update Playwright PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.e2e.outputs.playwright-artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ needs.e2e.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- anchor-notes-playwright-report -->';
            const runUrl = process.env.RUN_URL;
            const artifactUrl = process.env.ARTIFACT_URL || runUrl;
            const status = process.env.JOB_STATUS === 'success' ? 'passed' : 'did not pass';
            const body = [
              marker,
              '## Playwright screenshots',
              '',
              `Browser tests **${status}**.`,
              '',
              `[Download the Playwright report, screenshots, and diagnostics](${artifactUrl})`,
              '',
              `[View the CI run](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      playwright-artifact-url: ${{ steps.upload-playwright-artifacts.outputs.artifact-url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript and CSS
        run: npm run lint

      - name: Check lint autofix is clean
        run: |
          npm run lint:fix
          git diff --exit-code

      - name: Run unit tests
        run: npm test

      - name: Check TypeScript
        run: npm run compile

      - name: Build extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload Playwright report and screenshots
        id: upload-playwright-artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  publish-playwright-report:
    name: Publish Playwright report
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Update Playwright PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.verify.outputs.playwright-artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ needs.verify.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- anchor-notes-playwright-report -->';
            const runUrl = process.env.RUN_URL;
            const artifactUrl = process.env.ARTIFACT_URL || runUrl;
            const status = process.env.JOB_STATUS === 'success' ? 'passed' : 'did not pass';
            const body = [
              marker,
              '## Playwright screenshots',
              '',
              `Browser tests **${status}**.`,
              '',
              `[Download the Playwright report, screenshots, and diagnostics](${artifactUrl})`,
              '',
              `[View the CI run](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }
